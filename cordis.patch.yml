- insert:
    - id: prevent-peep
      name: prevent-peep
      config:
        # 首次运行时的默认值；用户用 大肥鱼我真该控制你了！.cmd 保存过配置后，以
        # $DSH_HOME/prevent-peep.json 为准（改完立即生效，无需重启）。
        mode: ask
        enforceRoots:
          - 'D:\'
        allowRoots:
          - 'D:\TE_Code'
          - 'D:\DSH'
        denyRoots: []
        scanShell: true
